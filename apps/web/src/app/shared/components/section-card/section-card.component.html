<mat-card class="card">
  <mat-card-header class="card-header">
    @if (hasTitle) {
      <mat-card-title class="card-title-wrap">
        <h2 class="card-title" title="">
          {{ title }}
          @if (tooltip) {
            <mat-icon
              class="card-title-info"
              [matTooltip]="tooltip"
              matTooltipPosition="right"
            matTooltipClass="card-title-tooltip">info_outline</mat-icon>
          }
        </h2>
      </mat-card-title>
    }

    <div class="card-header-actions">
      <ng-content select="[cardHeaderActions]"></ng-content>
    </div>
  </mat-card-header>

  <mat-card-content>
    <ng-content></ng-content>
  </mat-card-content>
</mat-card>
