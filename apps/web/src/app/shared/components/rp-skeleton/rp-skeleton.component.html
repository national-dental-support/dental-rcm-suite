<div
  class="rp-skel"
  [class.is-text]="variant === 'text'"
  [class.is-circle]="variant === 'circle'"
  [class.tone-muted]="tone === 'muted'"
  [class.anim-pulse]="animate === 'pulse'"
  [class.anim-shimmer]="animate === 'shimmer'"
  [style.width]="w"
  [style.height]="h"
  [style.borderRadius]="borderRadius"
></div>
