<mat-tab-group
  [selectedIndex]="selectedIndex"
  (selectedIndexChange)="tabChanged.emit($event)"
  class="custom-tab-group"
  animationDuration="0ms"
  >
  @for (tab of tabs; track tab; let i = $index) {
    <mat-tab [label]="tab">
      <ng-template matTabContent>
        <div style="padding: 1rem; border: 1px dashed gray;">
          <ng-container *ngComponentOutlet="components[i]"></ng-container>
        </div>
      </ng-template>
    </mat-tab>
  }
</mat-tab-group>
