<h2 mat-dialog-title>Post to PMS</h2>

<div mat-dialog-content>
  <p>
    You are about to post <strong>{{ data.eobCount }}</strong>
    {{ data.eobCount === 1 ? 'ERA/EOB' : 'ERAs/EOBs' }} to the practice management system.
  </p>
  @if (data.bankAccountName) {
    <p style="margin-top: 8px; color: var(--mat-theme-text-secondary, #666);">
      Bank account: <strong>{{ data.bankAccountName }}</strong>
    </p>
  }
  <p style="margin-top: 12px;">This action cannot be undone. Proceed?</p>
</div>

<div mat-dialog-actions align="end">
  <button mat-stroked-button type="button" (click)="cancel()">Cancel</button>
  <button mat-flat-button color="primary" type="button" (click)="confirm()">Post to PMS</button>
</div>
